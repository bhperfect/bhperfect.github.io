<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Washington Column</title>


    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <style>

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
            background: #f5f5f5;
            color: #222;
        }


        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem;
            background: white;
        }


        a {
            color: #245f8a;
        }


        .trip-header {
            margin-bottom: 2rem;
        }


        .trip-header h1 {
            margin-bottom: 0.3rem;
        }


        .trip-meta {
            color: #666;
        }


        .stats {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(150px, 1fr)
                );

            gap: 1rem;

            margin: 2rem 0;
        }


        .stat {
            padding: 1rem;
            background: #eee;
            border-radius: 4px;
        }


        .stat-label {
            font-size: 0.85rem;
            color: #555;
        }


        .stat-value {
            font-size: 1.4rem;
            font-weight: bold;
        }


        #map {
            height: 600px;
            width: 100%;
            margin: 2rem 0;
            background: #ddd;
        }


        article {
            max-width: 850px;
            margin: 0 auto;
        }

        .photo-popup-preview {
            display: block;
            width: 220px;
            max-width: 100%;
            max-height: 150px;
            object-fit: cover;
            border-radius: 4px;
            margin: 0.5rem 0;
        }


        article h2 {
            margin-top: 3rem;
        }


        article h3 {
            margin-top: 2rem;
        }


        figure {
            margin: 2.5rem 0;
        }


        figure img {
            display: block;
            width: 100%;
            height: auto;
        }


        figcaption {
            margin-top: 0.5rem;
            color: #555;
            font-style: italic;
        }


        .photo-marker {
            background: white;
            border: 2px solid #222;
            border-radius: 50%;

            width: 28px;
            height: 28px;

            line-height: 24px;
            text-align: center;

            font-weight: bold;
            font-size: 13px;

            box-shadow:
                0 1px 4px
                rgba(0, 0, 0, 0.5);
        }

    </style>

</head>


<body>

<main>

    <p>
        <a href="../">
            ← All trips
        </a>
    </p>


    <div class="trip-header">

        <h1>
            Washington Column
        </h1>


        <div class="trip-meta">

            2019-08-12

            
                – 2019-08-14
            

            · Climbing

        </div>


        

    </div>


    <h2>Trip Statistics</h2>


    <div class="stats">

        <div class="stat">

            <div class="stat-label">
                Distance
            </div>

            <div class="stat-value">
                0.0
                mi
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Elevation Gain
            </div>

            <div class="stat-value">
                0
                ft
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Trip Quality/10
            </div>

            <div class="stat-value">
                
                7
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Maximum Elevation
            </div>

            <div class="stat-value">

                

                    —

                

            </div>

        </div>

        <div class="stat">
            <div class="stat-label">Fun Type</div>
            
            <div class="stat-value">3</div>
        </div>
    </div>

    <h2>Route</h2>

    

    <div id="map"></div>


    <article>

        

    </article>

</main>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

    const activityColors = {"backpacking": "#4d7c0f", "bike": "#ea580c", "climbing": "#9333ea", "kayak": "#0891b2", "mountaineering": "#dc2626", "scramble": "#a16207", "ski": "#2563eb", "trail run": "#059669"};


    const activity =
        "Climbing";


    const map = L.map("map").setView(
        [
            37.7485,
            -119.5599
        ],
        11
    );


    L.tileLayer(
        "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 17,
            attribution:
                'Map data: &copy; OpenStreetMap contributors, SRTM | ' +
                'Map style: &copy; OpenTopoMap (CC-BY-SA)'
        }
    ).addTo(map);


    const routeLayers = [];


    async function addTrack(
        url,
        name
    ) {

        const response =
            await fetch(url);


        if (!response.ok) {

            console.error(
                "Unable to load track:",
                url
            );

            return;

        }


        const geojson =
            await response.json();


        const layer =
            L.geoJSON(
                geojson,
                {
                    style: {
                        color:
                            activityColors[
                                activity.trim().toLowerCase()
                            ] || "black",

                        weight: 4,

                        opacity: 0.85
                    }
                }
            );


        layer.bindPopup(name);

        layer.addTo(map);

        routeLayers.push(layer);

    }


    function addPhotoMarker(
        number,
        latitude,
        longitude,
        caption,
        photoUrl
    ) {

        const icon =
            L.divIcon({

                className: "",

                html:
                    `<div class="photo-marker">
                        ${number}
                    </div>`,

                iconSize: [28, 28],

                iconAnchor: [14, 14]

            });


        const marker =
            L.marker(
                [
                    latitude,
                    longitude
                ],
                {
                    icon: icon
                }
            );


        const popup = document.createElement("div");
        const title = document.createElement("strong");
        title.textContent = `Photo ${number}`;
        const link = document.createElement("a");
        link.href = `#photo-${number}`;
        const preview = document.createElement("img");
        preview.src = photoUrl;
        preview.alt = caption || `Photo ${number}`;
        preview.className = "photo-popup-preview";
        preview.loading = "lazy";
        link.appendChild(preview);
        const description = document.createElement("div");
        description.textContent = caption;
        popup.append(title, link, description);
        marker.bindPopup(popup, { maxWidth: 240 });


        marker.addTo(map);

    }


    function addWaypoint(
        name,
        latitude,
        longitude,
        type
    ) {

        const marker =
            L.marker(
                [
                    latitude,
                    longitude
                ]
            );


        marker.bindPopup(

            `
            <strong>
                ${name}
            </strong>

            <br>

            ${type}
            `

        );


        marker.addTo(map);

    }


    async function initializeMap() {

        const promises = [];


        


        await Promise.all(
            promises
        );


        /*
         * Only GPS-tagged photographs
         * receive markers.
         */

        


        /*
         * Add explicit trip waypoints.
         */

        


        /*
         * Zoom to the GPS track.
         */

        if (routeLayers.length > 0) {

            const group =
                L.featureGroup(
                    routeLayers
                );


            map.fitBounds(
                group.getBounds(),
                {
                    padding: [25, 25]
                }
            );

        }

    }


    initializeMap();

</script>

</body>

</html>
